upstream auth_service { server auth-service:8001; }
upstream product_service { server product-service:8002; }
upstream inventory_service { server inventory-service:8003; }
upstream order_service { server order-service:8004; }
upstream payment_service { server payment-service:8005; }
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
server {
 listen 8080; server_name localhost; root /usr/share/nginx/html; index index.html; limit_req_status 429;
 location /api/v1/auth { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://auth_service; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
 location /api/v1/users { proxy_pass http://auth_service; }
 location /api/v1/categories { proxy_pass http://product_service; }
 location /api/v1/products { proxy_pass http://product_service; }
 location /api/v1/inventories { proxy_pass http://inventory_service; }
 location /api/v1/carts { proxy_pass http://order_service; }
 location /api/v1/orders { proxy_pass http://order_service; }
 location /api/v1/vouchers { proxy_pass http://order_service; }
 location /api/v1/payments { proxy_pass http://payment_service; }
 location / { try_files $uri $uri/ =404; }
}
